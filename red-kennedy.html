.content{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden}

.node-details h4{font-size:13px;color:var(--text);margin-bottom:6px}

.connections-list{margin-top:8px;padding-left:0;list-style:none}

function calculateLayout(){
  const hubs=nodes.filter(n=>isHub(n.id)),others=nodes.filter(n=>!isHub(n.id)),layout={};
  const cx=600,cy=400;
  hubs.forEach((h,i)=>{const a=(i/hubs.length)*Math.PI*2-Math.PI/2,r=180;layout[h.id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}});
  others.forEach((n,i)=>{const conns=getNodeConnections(n.id);let ax=cx,ay=cy;
    if(conns.length>0){const conn=conns.map(c=>getNode(c.from===n.id?c.to:c.from)).filter(Boolean);
      if(conn.length>0){ax=conn.reduce((s,x)=>s+(layout[x.id]?.x||cx),0)/conn.length;ay=conn.reduce((s,x)=>s+(layout[x.id]?.y||cy),0)/conn.length}}
    const a=(i/others.length)*Math.PI*2,r=320+(i%3)*60;
    layout[n.id]={x:ax+Math.cos(a)*r*0.4,y:ay+Math.sin(a)*r*0.4}});
  for(let i=0;i<150;i++){nodes.forEach(n=>{getNodeConnections(n.id).forEach(c=>{
    const oid=c.from===n.id?c.to:c.from,o=layout[oid],cur=layout[n.id];
    if(o&&cur){const dx=o.x-cur.x,dy=o.y-cur.y,d=Math.hypot(dx,dy)||1,min=80;
      if(d<min){const p=(min-d)*0.02;cur.x-=dx/d*p;cur.y-=dy/d*p}}})})}
  return layout;
}

function init(){
  canvas=document.getElementById('networkCanvas');
  ctx=canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  positions=calculateLayout();
  setupInteractions();
  populateFilters();
  render();
  animate();
}

function resizeCanvas(){
  const wrap=canvas.parentElement;
  canvas.width=wrap.clientWidth*devicePixelRatio;
  canvas.height=wrap.clientHeight*devicePixelRatio;
  canvas.style.width=wrap.clientWidth+'px';
  canvas.style.height=wrap.clientHeight+'px';
  ctx.scale(devicePixelRatio,devicePixelRatio);
}

function setupInteractions(){
  let isDragging=false,dragNode=null,startX,startY;
  
  canvas.addEventListener('mousedown',e=>{
    const mx=e.offsetX,my=e.offsetY;
    dragNode=null;
    for(const [id,pos] of Object.entries(positions)){
      if(hiddenNodes.has(id))continue;
      const dx=mx-pos.x,dy=my-pos.y;
      if(Math.hypot(dx,dy)<25){dragNode=id;break}
    }
    if(dragNode){
      selectedNode=selectedNode===dragNode?null:dragNode;
      render();
    }else{
      isDragging=true;startX=mx-panX;startY=my-panY;
    }
  });
  
  canvas.addEventListener('mousemove',e=>{
    const mx=e.offsetX,my=e.offsetY;
    if(dragNode){
      positions[dragNode].x=mx;positions[dragNode].y=my;
    }else if(isDragging){
      panX=mx-startX;panY=my-startY;
    }
    // Tooltip
    let hovered=null;
    for(const [id,pos] of Object.entries(positions)){
      if(hiddenNodes.has(id))continue;
      if(Math.hypot(mx-pos.x,my-pos.y)<25){hovered=id;break}
    }
    const tooltip=document.getElementById('tooltip');
    if(hovered){
      const n=getNode(hovered),c=getNodeConnections(hovered);
      tooltip.innerHTML=`<strong>${n.id} · ${n.type.replace(/_/g,' ')}</strong><span>${n.label}</span><span style="color:${interactionColors[n.interaction]}">${n.interaction}</span><span>${c.length} conexiones${isHub(hovered)?' · <b style="color:var(--yellow)">Hub</b>':''}</span>`;
      tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY+12)+'px';tooltip.classList.add('visible');
      canvas.style.cursor='pointer';
    }else{
      tooltip.classList.remove('visible');
      canvas.style.cursor=isDragging?'grabbing':'grab';
    }
  });
  
  canvas.addEventListener('mouseup',()=>{isDragging=false;dragNode=null});
  canvas.addEventListener('mouseleave',()=>{isDragging=false;dragNode=null;document.getElementById('tooltip').classList.remove('visible')});
  canvas.addEventListener('dblclick',e=>{
    const mx=e.offsetX,my=e.offsetY;
    for(const [id,pos] of Object.entries(positions)){
      if(hiddenNodes.has(id))continue;
      if(Math.hypot(mx-pos.x,my-pos.y)<25){
        if(hiddenNodes.has(id))hiddenNodes.delete(id);else hiddenNodes.add(id);
        render();break;
      }
    }
  });
}

function populateFilters(){
  const tf=document.getElementById('typeFilter');
  Object.keys(typeColors).forEach(t=>{
    const o=document.createElement('option');o.value=t;o.textContent=t.replace(/_/g,' ');tf.appendChild(o);
  });
  renderTogglePanel();
  renderLegend();
}

function renderTogglePanel(){
  const p=document.getElementById('togglePanel');p.innerHTML='';
  nodes.forEach(n=>{
    const a=!hiddenNodes.has(n.id),b=document.createElement('button');
    b.className='toggle-btn'+(a?' active':'');b.textContent=n.id;
    b.onclick=()=>{if(hiddenNodes.has(n.id))hiddenNodes.delete(n.id);else hiddenNodes.add(n.id);render()};
    p.appendChild(b);
  });
}

function renderLegend(){
  const p=document.getElementById('legendPanel');p.innerHTML='';
  Object.entries(typeColors).forEach(([t,c])=>{
    const d=document.createElement('div');d.className='legend-item';
    d.innerHTML=`<div class="legend-swatch" style="background:${c}"></div>${t.replace(/_/g,' ')}`;
    p.appendChild(d);
  });
}

function filterNodes(){
  const s=document.getElementById('searchInput').value.toLowerCase(),
    tf=document.getElementById('typeFilter').value,
    mc=parseInt(document.getElementById('minConn').value);
  document.getElementById('minConnLabel').textContent=mc;
  hiddenNodes.clear();
  nodes.forEach(n=>{
    const c=getNodeConnections(n.id).length,
      ms=n.label.toLowerCase().includes(s)||n.id.toLowerCase().includes(s),
      mt=tf==='all'||n.type===tf,mc2=c>=mc;
    if(!ms||!mt||!mc2)hiddenNodes.add(n.id);
  });
  render();
}

function updateStats(){
  const vn=nodes.filter(n=>!hiddenNodes.has(n.id)),
    ve=edges.filter(e=>!hiddenNodes.has(e.from)&&!hiddenNodes.has(e.to)),
    hubs=vn.filter(n=>isHub(n.id)).length,
    me=vn.length*(vn.length-1)/2,d=me>0?Math.round((ve.length/me)*100):0,
    grado=vn.length>0?(ve.length*2/vn.length).toFixed(1):0;
  document.getElementById('statNodes').textContent=vn.length;
  document.getElementById('statEdges').textContent=ve.length;
  document.getElementById('statHubs').textContent=hubs;
  document.getElementById('statDensity').textContent=d+'%';
  // Metrics panel
  document.getElementById('mTaxones').textContent=vn.length;
  document.getElementById('mInteracciones').textContent=ve.length;
  document.getElementById('mHubs').textContent=hubs;
  document.getElementById('mDensidad').textContent=d+'%';
  document.getElementById('mGrado').textContent=grado;
  document.getElementById('mComponentes').textContent=countComponents(vn);
}

function countComponents(visibleNodes){
  const visited=new Set(),ids=new Set(visibleNodes.map(n=>n.id));
  let components=0;
  for(const n of visibleNodes){
    if(visited.has(n.id))continue;
    components++;
    const queue=[n.id];
    while(queue.length){
      const curr=queue.pop();
      if(visited.has(curr))continue;
      visited.add(curr);
      getNodeConnections(curr).forEach(c=>{
        const other=c.from===curr?c.to:c.from;
        if(!visited.has(other)&&ids.has(other))queue.push(other);
      });
    }
  }
  return components;
}

function render(){
  renderTogglePanel();
  updateStats();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(panX,panY);
  ctx.scale(zoom,zoom);
  
  // Draw edges
  edges.forEach(e=>{
    if(hiddenNodes.has(e.from)||hiddenNodes.has(e.to))return;
    const f=positions[e.from],t=positions[e.to];
    if(!f||!t)return;
    const fromNode=getNode(e.from),toNode=getNode(e.to);
    const color=interactionColors[fromNode.interaction]||'#888';
    const isHighlighted=selectedNode&&(e.from===selectedNode||e.to===selectedNode);
    ctx.beginPath();
    ctx.moveTo(f.x,f.y);
    ctx.lineTo(t.x,t.y);
    ctx.strokeStyle=color;
    ctx.lineWidth=isHighlighted?2.5:1;
    ctx.globalAlpha=isHighlighted?1:0.35;
    ctx.stroke();
    ctx.globalAlpha=1;
  });
  
  // Draw nodes
  nodes.forEach(n=>{
    if(hiddenNodes.has(n.id))return;
    const pos=positions[n.id];
    if(!pos)return;
    const color=typeColors[n.type]||'#888';
    const radius=isHub(n.id)?22:14;
    const isSelected=selectedNode===n.id;
    
    // Glow
    if(isSelected||isHub(n.id)){
      ctx.beginPath();
      ctx.arc(pos.x,pos.y,radius+8,0,Math.PI*2);
      ctx.fillStyle=color+'15';
      ctx.fill();
    }
    
    // Circle
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,radius,0,Math.PI*2);
    ctx.fillStyle='#0b0c0f';
    ctx.fill();
    ctx.strokeStyle=isSelected?'#fff':color;
    ctx.lineWidth=isSelected?3:isHub(n.id)?2.5:1.5;
    ctx.stroke();
    
    // Icon (first letter of type)
    ctx.fillStyle=color;
    ctx.font=`${isHub(n.id)?'bold 10px':'bold 7px'} Inter, sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(n.id,pos.x,pos.y);
    
    // Label
    ctx.fillStyle='#f2ece3';
    ctx.font='600 8px Inter, sans-serif';
    ctx.textAlign='center';
    ctx.fillText(n.id,pos.x,pos.y+radius+12);
    
    // Interaction badge
    ctx.fillStyle=interactionColors[n.interaction]||'#888';
    ctx.font='600 6px Inter, sans-serif';
    ctx.fillText(n.interaction,pos.x,pos.y+radius+22);
  });
  
  ctx.restore();
  requestAnimationFrame(animate);
}

function selectNode(id){
  selectedNode=selectedNode===id?null:id;
  render();
  const d=document.getElementById('nodeDetails');
  if(!selectedNode){
    d.innerHTML='<h3><i class="fa-solid fa-crosshairs"></i> Inspección del nodo</h3><p>Haz clic en un nodo para ver sus conexiones. Doble clic para ocultar/mostrar.</p>';
    return;
  }
  const n=getNode(selectedNode),conns=getNodeConnections(selectedNode);
  let h=`<h3><i class="fa-solid fa-crosshairs"></i> Inspección del nodo</h3>`;
  h+=`<h4>${n.id}</h4><p style="font-size:10px;color:var(--muted);margin-bottom:8px">${n.label}</p>`;
  h+=`<span class="node-type" style="background:${typeColors[n.type]}22;color:${typeColors[n.type]}">${n.type.replace(/_/g,' ')}</span>`;
  h+=`<div style="margin-top:8px"><span class="interaction-badge" style="background:${interactionColors[n.interaction]}22;color:${interactionColors[n.interaction]}">${n.interaction}</span></div>`;
  h+=`<div style="font-size:10px;margin-top:8px"><strong>Conexiones:</strong> ${conns.length}</div>`;
  if(isHub(n.id))h+=`<div style="font-size:10px;color:var(--yellow);margin-top:4px"><i class="fa-solid fa-star"></i> Hub de red</div>`;
  if(conns.length>0){
    h+='<ul class="connections-list">';
    conns.forEach(c=>{
      const o=c.from===selectedNode?c.to:c.from;
      const other=getNode(o);
      h+=`<li><i class="fa-solid fa-arrow-right" style="color:${typeColors[n.type]}"></i> ${o} · ${other.interaction}</li>`;
    });
    h+='</ul>';
  }
  d.innerHTML=h;
}

function toggleMetrics(){
  document.getElementById('metricsPanel').classList.toggle('visible');
}

function zoomIn(){zoom=Math.min(zoom*1.2,3)}
function zoomOut(){zoom=Math.max(zoom/1.2,0.3)}
function zoomReset(){zoom=1;panX=0;panY=0}
function resetView(){zoomReset();hiddenNodes.clear();selectedNode=null;document.getElementById('searchInput').value='';document.getElementById('typeFilter').value='all';document.getElementById('minConn').value=0;render()}

function exportPNG(){
  const link=document.createElement('a');
  link.download='red-kennedy-socioecologica.png';
  link.href=canvas.toDataURL('image/png');
  link.click();
}

// Expose selectNode for potential external use
window.selectNode=selectNode;

init();
</script>
</body>
</html>
