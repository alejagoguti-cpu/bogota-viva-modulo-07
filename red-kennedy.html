.topbar-actions { display: flex; gap: 8px; }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; transition: all 0.18s; }
.icon-btn:hover { color: var(--teal); border-color: var(--teal); }
.content { flex: 1; display: grid; grid-template-columns: 1fr 320px; overflow: hidden; }
.canvas-wrap { position: relative; overflow: hidden; background: radial-gradient(circle at 50% 45%, rgba(30,81,75,0.15), transparent 60%), #0b0c0f; }
.canvas-wrap svg { width: 100%; height: 100%; cursor: grab; }
.canvas-wrap svg:active { cursor: grabbing; }
.sidebar-right { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 16px; }
.panel { background: #1a1b1e; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }

.filter-group select { width: 100%; padding: 6px 8px; background: #111817; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; }
.filter-group input[type="range"] { width: 100%; accent-color: var(--teal); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: #111817; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
.stat-card b { display: block; font-size: 20px; color: var(--teal); font-family: 'Space Grotesk', sans-serif; }
.stat-card span { font-size: 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.node-details h4 { font-size: 13px; color: var(--text); margin-bottom: 6px; }
.node-details .node-type { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; margin-bottom: 8px; }
.connections-list { margin-top: 8px; padding-left: 0; list-style: none; }
.connections-list li { font-size: 10px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--muted); }
.connections-list li:last-child { border-bottom: none; }
.connections-list li i { margin-right: 6px; font-size: 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--muted); }
.legend-swatch { width: 10px; height: 10px; border-radius: 50%; }
.zoom-controls { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 6px; z-index: 10; }
.zoom-controls button { width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 8px; background: rgba(11,12,15,0.9); color: var(--teal); font-size: 16px; cursor: pointer; transition: all 0.18s; }
.zoom-controls button:hover { background: rgba(70,214,208,0.15); border-color: var(--teal); }
.tooltip { position: fixed; z-index: 1000; display: none; max-width: 280px; padding: 12px 14px; background: #1a1b1e; border: 1px solid rgba(70,214,208,0.4); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,0.5); pointer-events: none; }
.tooltip.visible { display: block; }

.network-node.selected circle { stroke: #fff !important; stroke-width: 4 !important; filter: drop-shadow(0 0 12px #fff); }

</div>

let zoom=1,panX=0,panY=0,selectedNode=null,hiddenNodes=new Set();

function getNode(id){return nodes.find(n=>n.id===id)}
function getNodeConnections(id){return edges.filter(e=>e.from===id||e.to===id)}
function isHub(id){return getNodeConnections(id).length>=4}

function calculateLayout(){
  const hubs=nodes.filter(n=>isHub(n.id)),others=nodes.filter(n=>!isHub(n.id)),layout={};
  const cx=600,cy=400;
  hubs.forEach((h,i)=>{const a=(i/hubs.length)*Math.PI*2-Math.PI/2,r=180;layout[h.id]={x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}});
  others.forEach((n,i)=>{const conns=getNodeConnections(n.id);let ax=cx,ay=cy;
    if(conns.length>0){const conn=conns.map(c=>getNode(c.from===n.id?c.to:c.from)).filter(Boolean);
      if(conn.length>0){ax=conn.reduce((s,x)=>s+(layout[x.id]?.x||cx),0)/conn.length;ay=conn.reduce((s,x)=>s+(layout[x.id]?.y||cy),0)/conn.length}}
    const a=(i/others.length)*Math.PI*2,r=320+(i%3)*60;
    layout[n.id]={x:ax+Math.cos(a)*r*0.4,y:ay+Math.sin(a)*r*0.4}});
  for(let i=0;i<150;i++){nodes.forEach(n=>{getNodeConnections(n.id).forEach(c=>{
    const oid=c.from===n.id?c.to:c.from,o=layout[oid],cur=layout[n.id];
    if(o&&cur){const dx=o.x-cur.x,dy=o.y-cur.y,d=Math.hypot(dx,dy)||1,min=80;
      if(d<min){const p=(min-d)*0.02;cur.x-=dx/d*p;cur.y-=dy/d*p}}})})}
  return layout;
}

function render(){
  const layout=calculateLayout(),eL=document.getElementById('edgesLayer'),nL=document.getElementById('nodesLayer');
  eL.innerHTML='';nL.innerHTML='';
  edges.forEach(e=>{
    const f=layout[e.from],t=layout[e.to];if(!f||!t)return;
    const dx=t.x-f.x,dy=t.y-f.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
    const fr=isHub(e.from)?22:14,tr=isHub(e.to)?22:14;
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',f.x+ux*fr);l.setAttribute('y1',f.y+uy*fr);
    l.setAttribute('x2',t.x-ux*(tr+6));l.setAttribute('y2',t.y-uy*(tr+6));
    l.setAttribute('stroke','#888');l.setAttribute('stroke-width','1');
    l.setAttribute('opacity',hiddenNodes.has(e.from)||hiddenNodes.has(e.to)?0:0.4);
    l.setAttribute('class','network-edge');eL.appendChild(l)});
  nodes.forEach(n=>{
    const p=layout[n.id];if(!p)return;
    const c=typeColors[n.type]||'#888',r=isHub(n.id)?22:14,h=hiddenNodes.has(n.id);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','network-node'+(h?' dimmed':'')+(selectedNode===n.id?' selected':''));
    g.setAttribute('transform',`translate(${p.x},${p.y})`);
    const ci=document.createElementNS('http://www.w3.org/2000/svg','circle');
    ci.setAttribute('r',r);ci.setAttribute('fill','#0b0c0f');ci.setAttribute('stroke',c);
    ci.setAttribute('stroke-width',isHub(n.id)?2.5:1.5);g.appendChild(ci);
    if(isHub(n.id)){const ha=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ha.setAttribute('r',r+4);ha.setAttribute('fill','none');ha.setAttribute('stroke',c);
      ha.setAttribute('stroke-width','0.5');ha.setAttribute('stroke-dasharray','2,2');
      ha.setAttribute('opacity','0.4');g.appendChild(ha)}
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('text-anchor','middle');t.setAttribute('dy','4');
    t.setAttribute('fill',c);t.setAttribute('font-size',isHub(n.id)?'10':'7');
    t.setAttribute('font-weight','600');t.textContent=n.id;g.appendChild(t);
    g.addEventListener('click',ev=>{ev.stopPropagation();selectNode(n.id)});
    g.addEventListener('mouseenter',ev=>showTooltip(ev,n));
    g.addEventListener('mouseleave',hideTooltip);nL.appendChild(g)});
  updateStats();renderTogglePanel();renderLegend()}

function renderTogglePanel(){const p=document.getElementById('togglePanel');p.innerHTML='';
  nodes.forEach(n=>{const a=!hiddenNodes.has(n.id),b=document.createElement('button');
    b.className='toggle-btn'+(a?' active':'');b.textContent=n.id;
    b.onclick=()=>toggleNode(n.id);p.appendChild(b)})}

function renderLegend(){const p=document.getElementById('legendPanel');p.innerHTML='';
  Object.entries(typeColors).forEach(([t,c])=>{const d=document.createElement('div');
    d.className='legend-item';
    d.innerHTML=`<div class="legend-swatch" style="background:${c}"></div>${t.replace(/_/g,' ')}`;
    p.appendChild(d)})}

function toggleNode(id){if(hiddenNodes.has(id))hiddenNodes.delete(id);else hiddenNodes.add(id);render()}

function selectNode(id){selectedNode=selectedNode===id?null:id;render();
  const d=document.getElementById('nodeDetails');
  if(!selectedNode){d.innerHTML='<h3><i class="fa-solid fa-crosshairs"></i> Inspección del nodo</h3><p>Haz clic en un nodo para ver sus conexiones y detalles.</p>';return}
  const n=getNode(selectedNode),conns=getNodeConnections(selectedNode);
  let h=`<h3><i class="fa-solid fa-crosshairs"></i> Inspección del nodo</h3>`;
  h+=`<h4>${n.id}</h4><p style="font-size:10px;color:var(--muted);margin-bottom:8px">${n.label}</p>`;
  h+=`<span class="node-type" style="background:${typeColors[n.type]}22;color:${typeColors[n.type]}">${n.type.replace(/_/g,' ')}</span>`;
  h+=`<div style="font-size:10px;margin-top:8px"><strong>Conexiones:</strong> ${conns.length}</div>`;
  if(isHub(n.id))h+=`<div style="font-size:10px;color:var(--yellow);margin-top:4px"><i class="fa-solid fa-star"></i> Hub de red</div>`;
  if(conns.length>0){h+='<ul class="connections-list">';
    conns.forEach(c=>{const o=c.from===selectedNode?c.to:c.from;h+=`<li><i class="fa-solid fa-arrow-right" style="color:${typeColors[n.type]}"></i> ${o}</li>`});
    h+='</ul>'}d.innerHTML=h}

function filterNodes(){
  const s=document.getElementById('searchInput').value.toLowerCase(),
    tf=document.getElementById('typeFilter').value,
    mc=parseInt(document.getElementById('minConn').value);
  document.getElementById('minConnLabel').textContent=mc;hiddenNodes.clear();
  nodes.forEach(n=>{const c=getNodeConnections(n.id).length,
    ms=n.label.toLowerCase().includes(s)||n.id.toLowerCase().includes(s),
    mt=tf==='all'||n.type===tf,mc2=c>=mc;
    if(!ms||!mt||!mc2)hiddenNodes.add(n.id)});render()}

function updateStats(){
  const vn=nodes.filter(n=>!hiddenNodes.has(n.id)),
    ve=edges.filter(e=>!hiddenNodes.has(e.from)&&!hiddenNodes.has(e.to)),
    hubs=vn.filter(n=>isHub(n.id)).length,
    me=vn.length*(vn.length-1)/2,d=me>0?Math.round((ve.length/me)*100):0;
  document.getElementById('statNodes').textContent=vn.length;
  document.getElementById('statEdges').textContent=ve.length;
  document.getElementById('statHubs').textContent=hubs;
  document.getElementById('statDensity').textContent=d+'%'}

function showTooltip(ev,n){const t=document.getElementById('tooltip'),c=getNodeConnections(n.id);
  t.innerHTML=`<strong>${n.id}</strong><span>${n.label}</span><span>${c.length} conexiones${isHub(n.id)?' · Hub':''}</span>`;
  t.style.left=(ev.clientX+12)+'px';t.style.top=(ev.clientY+12)+'px';t.classList.add('visible')}
function hideTooltip(){document.getElementById('tooltip').classList.remove('visible')}
function zoomIn(){zoom=Math.min(zoom*1.2,3);applyTransform()}
function zoomOut(){zoom=Math.max(zoom/1.2,0.3);applyTransform()}
function zoomReset(){zoom=1;panX=0;panY=0;applyTransform()}
function resetView(){zoomReset();hiddenNodes.clear();selectedNode=null;document.getElementById('searchInput').value='';document.getElementById('typeFilter').value='all';document.getElementById('minConn').value=0;render()}
function applyTransform(){document.getElementById('networkSvg').style.transform=`scale(${zoom}) translate(${panX}px,${panY}px)`}
function exportSVG(){const s=document.getElementById('networkSvg');const b=new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='red-kennedy.svg';a.click()}

let isPanning=false,sx,sy;
const svg=document.getElementById('networkSvg');
svg.addEventListener('mousedown',e=>{if(e.target===svg){isPanning=true;sx=e.clientX-panX;sy=e.clientY-panY}});
svg.addEventListener('mousemove',e=>{if(isPanning){panX=e.clientX-sx;panY=e.clientY-sy;applyTransform()}});
svg.addEventListener('mouseup',()=>{isPanning=false});
svg.addEventListener('mouseleave',()=>{isPanning=false});
svg.addEventListener('click',e=>{if(e.target===svg){selectedNode=null;render()}});

const tf=document.getElementById('typeFilter');
Object.keys(typeColors).forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.replace(/_/g,' ');tf.appendChild(o)});

render();
</script>
</body>
</html>
